<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Gastos</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --bg: #1c1f1d;
    --panel: #242822;
    --ink: #eae6da;
    --ink-dim: #9a9c93;
    --line: #3a3e37;
    --gasto: #b5533c;
    --ingreso: #4f7d5c;
    --amber: #c98a3b;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height:1.4;
  }
  .wrap{ max-width: 480px; margin: 0 auto; padding: 20px 16px 80px; }

  header{ margin-bottom: 18px; }
  header h1{
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  header p{ margin:0; color: var(--ink-dim); font-size: 0.85rem; }

  .mes-selector{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px;
  }
  .mes-selector button{
    background:none; border:none; color: var(--ink); font-size:1.2rem;
    padding: 4px 10px; cursor:pointer;
  }
  .mes-selector span{ font-weight:600; text-transform: capitalize; }

  .resumen{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }
  .resumen .fila{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 4px 0;
  }
  .resumen .fila.total{
    border-top: 1px solid var(--line);
    margin-top: 6px; padding-top: 10px;
  }
  .resumen .label{ color: var(--ink-dim); font-size: 0.85rem; }
  .resumen .monto{ font-variant-numeric: tabular-nums; font-weight:600; }
  .resumen .monto.gasto{ color: var(--gasto); }
  .resumen .monto.ingreso{ color: var(--ingreso); }
  .resumen .monto.neutro{ color: var(--ink-dim); }
  .resumen .fila.total .monto{ font-size: 1.3rem; }

  form{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    gap: 10px;
  }
  .tipo-toggle{ display:flex; gap:8px; }
  .tipo-toggle button{
    flex:1; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink-dim); font-weight:600; cursor:pointer;
    font-size: 0.9rem;
  }
  .tipo-toggle button.active[data-tipo="gasto"]{ background: var(--gasto); color:#fff; border-color: var(--gasto); }
  .tipo-toggle button.active[data-tipo="ingreso"]{ background: var(--ingreso); color:#fff; border-color: var(--ingreso); }

  label{ font-size: 0.78rem; color: var(--ink-dim); display:block; margin-bottom:3px; }
  input, select, textarea{
    width:100%; background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 9px 10px; color: var(--ink); font-size: 0.95rem;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus{ outline: 1px solid var(--amber); }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fecha-nav{ display:flex; align-items:center; gap: 4px; }
  .fecha-nav input{ flex:1; }
  .fecha-nav button{
    background: var(--bg); border:1px solid var(--line); color: var(--ink);
    border-radius: 7px; width: 32px; height: 36px; font-size:1.1rem; cursor:pointer; flex-shrink:0;
  }

  .btn-guardar{
    background: var(--amber); color: #1c1f1d; border:none; border-radius: 8px;
    padding: 12px; font-weight:700; font-size: 0.95rem; cursor:pointer; margin-top:4px;
  }
  .btn-guardar:active{ transform: scale(0.99); }

  .lista{ display:flex; flex-direction:column; gap: 8px; }
  .item{
    background: var(--panel); border:1px solid var(--line); border-radius: 9px;
    padding: 11px 12px; display:flex; justify-content:space-between; align-items:center;
    gap: 10px;
  }
  .item .info{ min-width:0; }
  .item .cat{ font-weight:600; font-size:0.92rem; }
  .item .meta{ color: var(--ink-dim); font-size: 0.76rem; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .der{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .item .monto{ font-weight:700; font-variant-numeric: tabular-nums; }
  .item .monto.gasto{ color: var(--gasto); }
  .item .monto.ingreso{ color: var(--ingreso); }
  .item .del{ background:none; border:none; color: var(--ink-dim); font-size:1rem; cursor:pointer; padding:2px 4px; }

  .vacio{ text-align:center; color: var(--ink-dim); padding: 30px 0; font-size:0.9rem; }
  .origen-tag{
    font-size: 0.68rem; padding: 1px 6px; border-radius: 20px; border:1px solid var(--line);
    color: var(--ink-dim); white-space:nowrap;
  }

  .filtro-cat{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--panel); border:1px solid var(--amber); border-radius: 8px;
    padding: 8px 12px; margin-bottom: 10px; font-size: 0.85rem;
  }
  .filtro-cat button{
    background:none; border:none; color: var(--amber); font-size: 0.8rem; cursor:pointer; font-weight:600;
  }

  .panel{
    background: var(--panel); border:1px solid var(--line); border-radius: 10px;
    padding: 16px; margin-bottom: 18px;
  }
  .panel h2{ font-size: 0.95rem; margin: 0 0 12px; font-weight:600; }
  .panel-vacio{ color: var(--ink-dim); font-size: 0.85rem; text-align:center; padding: 10px 0; }

  .cat-link{
    background:none; border:none; color: var(--ink-dim); font-size: 0.78rem;
    text-decoration: underline; cursor:pointer; padding: 0; margin-top: -4px; margin-bottom: 4px;
    display:inline-block;
  }
  .cat-manager{ display:none; }
  .cat-manager.open{ display:block; }
  .cat-manager-tipos{ display:flex; gap:8px; margin-bottom:10px; }
  .cat-manager-tipos button{
    flex:1; padding:7px; border-radius:7px; border:1px solid var(--line);
    background:transparent; color:var(--ink-dim); font-size:0.82rem; cursor:pointer;
  }
  .cat-manager-tipos button.active{ background: var(--amber); color:#1c1f1d; border-color: var(--amber); font-weight:600; }
  .cat-lista{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .cat-item{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--bg); border:1px solid var(--line); border-radius:7px; padding:7px 10px;
    font-size:0.85rem;
  }
  .cat-item button{ background:none; border:none; color: var(--gasto); cursor:pointer; font-size:0.9rem; }
  .cat-add{ display:flex; gap:8px; }
  .cat-add input{ flex:1; }
  .cat-add button{
    background: var(--ingreso); color:#fff; border:none; border-radius:7px; padding: 0 14px; cursor:pointer; font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Control de gastos</h1>
    <p>Cargá rápido, ordená después</p>
  </header>

  <div class="mes-selector">
    <button id="mesAnterior">‹</button>
    <span id="mesLabel">-</span>
    <button id="mesSiguiente">›</button>
  </div>

  <div class="resumen">
    <div class="fila">
      <span class="label">Ingresos (electricidad, etc.)</span>
      <span class="monto ingreso" id="totalIngresos">$0</span>
    </div>
    <div class="fila">
      <span class="label">Sueldo retirado de pollería</span>
      <span class="monto ingreso" id="totalPolleria">$0</span>
    </div>
    <div class="fila" style="border-top:1px solid var(--line); padding-top:8px;">
      <span class="label">Total ingresos</span>
      <span class="monto ingreso" id="totalIngresosGral">$0</span>
    </div>
    <div class="fila">
      <span class="label">Gastos totales</span>
      <span class="monto gasto" id="totalGastos">$0</span>
    </div>
    <div class="fila total">
      <span class="label">Saldo del mes</span>
      <span class="monto" id="totalSaldo">$0</span>
    </div>
  </div>

  <div class="panel" id="panelGrafico">
    <h2>Gastos por categoría</h2>
    <canvas id="graficoCategorias" height="200"></canvas>
    <div class="panel-vacio" id="graficoVacio" style="display:none;">Sin gastos cargados este mes</div>
  </div>

  <form id="formMovimiento">
    <div class="tipo-toggle">
      <button type="button" class="active" data-tipo="gasto">Gasto</button>
      <button type="button" data-tipo="ingreso">Ingreso</button>
    </div>

    <div class="row2">
      <div>
        <label for="monto">Monto</label>
        <input type="number" id="monto" inputmode="decimal" step="0.01" min="0" required placeholder="0">
      </div>
      <div>
        <label for="fecha">Fecha</label>
        <div class="fecha-nav">
          <button type="button" id="fechaAtras">‹</button>
          <input type="date" id="fecha" required>
          <button type="button" id="fechaAdelante">›</button>
        </div>
      </div>
    </div>

    <div>
      <label for="categoria">Categoría</label>
      <select id="categoria" required></select>
      <button type="button" class="cat-link" id="btnGestionarCat">Agregar / editar categorías</button>
    </div>

    <div class="cat-manager" id="catManager">
      <div class="cat-manager-tipos">
        <button type="button" class="active" data-cattipo="gasto">Gasto</button>
        <button type="button" data-cattipo="ingreso">Ingreso</button>
      </div>
      <div class="cat-lista" id="catLista"></div>
      <div class="cat-add">
        <input type="text" id="nuevaCategoria" placeholder="Nueva categoría">
        <button type="button" id="btnAgregarCat">Agregar</button>
      </div>
    </div>

    <div>
      <label for="descripcion">Descripción (opcional)</label>
      <input type="text" id="descripcion" placeholder="Detalle breve">
    </div>

    <div class="row2">
      <div>
        <label for="medioPago">Medio de pago</label>
        <select id="medioPago">
          <option value="efectivo">Efectivo</option>
          <option value="transferencia">Transferencia</option>
          <option value="tarjeta">Tarjeta</option>
          <option value="mixto">Mixto</option>
        </select>
      </div>
      <div>
        <label for="origen">Origen</label>
        <select id="origen">
          <option value="sin_definir">Sin definir</option>
          <option value="personal">Personal</option>
          <option value="polleria">Pollería</option>
          <option value="electricidad">Electricidad</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn-guardar">Guardar movimiento</button>
  </form>

  <div class="filtro-cat" id="filtroCatBanner" style="display:none;">
    <span id="filtroCatTexto"></span>
    <button type="button" id="btnLimpiarFiltro">Ver todos ✕</button>
  </div>

  <div class="lista" id="lista"></div>
</div>

<script>
const SUPABASE_URL = "https://ofixvquuradjggbzcpvl.supabase.co";
const SUPABASE_KEY = "sb_publishable_Z6sKOy9VlujAPNVpIIz6Zg_bywUIdpL";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let categorias = { gasto: [], ingreso: [] };
let tipoActual = "gasto";
let tipoGestion = "gasto";
let fechaRef = new Date();
let chartCategorias = null;
let categoriaFiltro = null;

const $ = (id) => document.getElementById(id);
const fmt = (n) => "$" + Number(n).toLocaleString("es-AR", {minimumFractionDigits:0, maximumFractionDigits:0});

async function cargarCategorias(){
  const {data, error} = await sb.from("categorias").select("*").order("nombre");
  if(error){ console.error(error); return; }
  categorias = { gasto: [], ingreso: [] };
  data.forEach(c => categorias[c.tipo].push(c.nombre));
  poblarCategorias();
  renderCatLista();
}

function poblarCategorias(){
  const opciones = categorias[tipoActual] || [];
  $("categoria").innerHTML = opciones.map(c => `<option value="${c}">${c}</option>`).join("");
}

document.querySelectorAll(".tipo-toggle button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tipo-toggle button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tipoActual = btn.dataset.tipo;
    poblarCategorias();
  });
});

// --- Gestión de categorías ---
$("btnGestionarCat").addEventListener("click", () => {
  $("catManager").classList.toggle("open");
});

document.querySelectorAll(".cat-manager-tipos button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-manager-tipos button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    tipoGestion = btn.dataset.cattipo;
    renderCatLista();
  });
});

function renderCatLista(){
  const lista = $("catLista");
  const items = categorias[tipoGestion] || [];
  lista.innerHTML = items.map(nombre => `
    <div class="cat-item">
      <span>${nombre}</span>
      <button data-nombre="${nombre}" class="btnBorrarCat">✕</button>
    </div>
  `).join("");

  document.querySelectorAll(".btnBorrarCat").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!confirm(`¿Borrar la categoría "${btn.dataset.nombre}"? Los movimientos ya cargados con esta categoría no se modifican.`)) return;
      await sb.from("categorias").delete().eq("tipo", tipoGestion).eq("nombre", btn.dataset.nombre);
      await cargarCategorias();
    });
  });
}

$("btnAgregarCat").addEventListener("click", async () => {
  const nombre = $("nuevaCategoria").value.trim();
  if(!nombre) return;
  const {error} = await sb.from("categorias").insert({tipo: tipoGestion, nombre});
  if(error){ alert("Error: " + (error.message.includes("duplicate") ? "esa categoría ya existe" : error.message)); return; }
  $("nuevaCategoria").value = "";
  await cargarCategorias();
});

function rangoMes(fecha){
  const y = fecha.getFullYear(), m = fecha.getMonth();
  const inicio = new Date(y, m, 1).toISOString().slice(0,10);
  const fin = new Date(y, m + 1, 0).toISOString().slice(0,10);
  return {inicio, fin};
}

function actualizarLabelMes(){
  $("mesLabel").textContent = fechaRef.toLocaleDateString("es-AR", {month:"long", year:"numeric"});
}

async function cargarMovimientos(){
  const {inicio, fin} = rangoMes(fechaRef);
  const {data, error} = await sb.from("movimientos")
    .select("*")
    .gte("fecha", inicio)
    .lte("fecha", fin)
    .order("fecha", {ascending:false})
    .order("created_at", {ascending:false});

  if(error){ console.error(error); return; }

  let totalGastos = 0, totalIngresos = 0, totalPolleria = 0;
  const lista = $("lista");
  lista.innerHTML = "";

  const datosFiltrados = categoriaFiltro ? data.filter(m => m.categoria === categoriaFiltro) : data;

  if($("filtroCatBanner")){
    $("filtroCatBanner").style.display = categoriaFiltro ? "flex" : "none";
    if(categoriaFiltro) $("filtroCatTexto").textContent = `Mostrando: ${categoriaFiltro}`;
  }

  if(!datosFiltrados.length){
    lista.innerHTML = `<div class="vacio">${categoriaFiltro ? "No hay movimientos de esta categoría este mes" : "No hay movimientos cargados este mes"}</div>`;
  }

  data.forEach(mov => {
    const monto = Number(mov.monto);
    if(mov.tipo === "gasto"){
      totalGastos += monto;
      if(mov.origen === "polleria") totalPolleria += monto;
    } else {
      totalIngresos += monto;
    }
  });

  datosFiltrados.forEach(mov => {
    const monto = Number(mov.monto);
    const div = document.createElement("div");
    div.className = "item";
    const fechaCorta = mov.fecha.slice(8,10) + "/" + mov.fecha.slice(5,7);
    div.innerHTML = `
      <div class="info">
        <div class="cat">${mov.categoria}</div>
        <div class="meta">${fechaCorta}${mov.descripcion ? " · " + mov.descripcion : ""} · ${mov.medio_pago || ""}</div>
      </div>
      <div class="der">
        <span class="origen-tag">${mov.origen === "sin_definir" ? "?" : mov.origen}</span>
        <span class="monto ${mov.tipo}">${mov.tipo === "gasto" ? "-" : "+"}${fmt(monto)}</span>
        <button class="del" data-id="${mov.id}">✕</button>
      </div>
    `;
    lista.appendChild(div);
  });

  $("totalGastos").textContent = fmt(totalGastos);
  $("totalIngresos").textContent = fmt(totalIngresos);
  $("totalPolleria").textContent = fmt(totalPolleria);
  $("totalIngresosGral").textContent = fmt(totalIngresos + totalPolleria);
  $("totalSaldo").textContent = fmt((totalIngresos + totalPolleria) - totalGastos);

  dibujarGrafico(data.filter(m => m.tipo === "gasto"));

  document.querySelectorAll(".del").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!confirm("¿Borrar este movimiento?")) return;
      await sb.from("movimientos").delete().eq("id", btn.dataset.id);
      cargarMovimientos();
    });
  });
}

$("btnLimpiarFiltro").addEventListener("click", () => {
  categoriaFiltro = null;
  cargarMovimientos();
});

function dibujarGrafico(gastos){
  const canvas = $("graficoCategorias");
  if(!gastos.length){
    canvas.style.display = "none";
    $("graficoVacio").style.display = "block";
    if(chartCategorias) chartCategorias.destroy();
    return;
  }
  canvas.style.display = "block";
  $("graficoVacio").style.display = "none";

  const porCategoria = {};
  gastos.forEach(g => { porCategoria[g.categoria] = (porCategoria[g.categoria] || 0) + Number(g.monto); });
  const entradas = Object.entries(porCategoria).sort((a,b) => b[1] - a[1]);

  if(chartCategorias) chartCategorias.destroy();
  chartCategorias = new Chart(canvas, {
    type: "bar",
    data: {
      labels: entradas.map(e => e[0]),
      datasets: [{
        data: entradas.map(e => e[1]),
        backgroundColor: "#b5533c",
        borderRadius: 5,
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      onClick: (evt, elements) => {
        if(!elements.length) return;
        const idx = elements[0].index;
        categoriaFiltro = entradas[idx][0];
        cargarMovimientos();
        $("lista").scrollIntoView({behavior:"smooth", block:"start"});
      },
      onHover: (evt, elements) => {
        canvas.style.cursor = elements.length ? "pointer" : "default";
      },
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#9a9c93" }, grid: { color: "#3a3e37" } },
        y: { ticks: { color: "#eae6da" }, grid: { display: false } }
      }
    }
  });
}

$("formMovimiento").addEventListener("submit", async (e) => {
  e.preventDefault();
  const nuevo = {
    tipo: tipoActual,
    monto: parseFloat($("monto").value),
    fecha: $("fecha").value,
    categoria: $("categoria").value,
    descripcion: $("descripcion").value || null,
    medio_pago: $("medioPago").value,
    origen: $("origen").value
  };
  const {error} = await sb.from("movimientos").insert(nuevo);
  if(error){ alert("Error al guardar: " + error.message); return; }

  $("monto").value = "";
  $("descripcion").value = "";
  cargarMovimientos();
});

$("mesAnterior").addEventListener("click", () => {
  fechaRef.setMonth(fechaRef.getMonth() - 1);
  categoriaFiltro = null;
  actualizarLabelMes(); cargarMovimientos();
});
$("mesSiguiente").addEventListener("click", () => {
  fechaRef.setMonth(fechaRef.getMonth() + 1);
  categoriaFiltro = null;
  actualizarLabelMes(); cargarMovimientos();
});

function moverFechaForm(dias){
  const actual = new Date($("fecha").value + "T00:00:00");
  actual.setDate(actual.getDate() + dias);
  $("fecha").value = actual.toISOString().slice(0,10);
}
$("fechaAtras").addEventListener("click", () => moverFechaForm(-1));
$("fechaAdelante").addEventListener("click", () => moverFechaForm(1));

// init
$("fecha").value = new Date().toISOString().slice(0,10);
actualizarLabelMes();
cargarCategorias();
cargarMovimientos();
</script>
</body>
</html>
